<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; font-src {{cspSource}};" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{cssUri}}" />
    <title>Thief Write</title>
</head>
<body>
    <textarea id="doc"
              class="doc"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              wrap="soft"
              aria-label="编辑器"></textarea>
    <div class="recent" id="recent" title="最近输入的两位真实字符" hidden></div>
    <script src="{{coreUri}}"></script>
    <script src="{{jsUri}}"></script>
</body>
</html>
