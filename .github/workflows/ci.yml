name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test

      - name: Verify packaging (manifest + icon)
        run: npx vsce package --out thief-write-ci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: thief-write-vsix
          path: thief-write-ci.vsix
          if-no-files-found: error
