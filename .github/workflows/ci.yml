name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Verify packaging
        run: npx vsce package --out thief-write-ci.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: thief-write-${{ matrix.os }}
          path: thief-write-ci.vsix
          if-no-files-found: error
